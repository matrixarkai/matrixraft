[package]
name = "matrixraft"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Open-source Rust Raft consensus library: many groups on a fixed thread pool, snapshots, membership changes, and lease reads."
repository = "https://github.com/matrixarkai/matrixraft"
readme = "README.md"
keywords = ["raft", "consensus", "distributed-systems", "multi-raft", "replication"]
categories = ["concurrency", "data-structures", "network-programming"]
homepage = "https://github.com/matrixarkai/matrixraft"
documentation = "https://docs.rs/matrixraft"
exclude = ["/scripts", "/.github"]

[dependencies]
# "rc" lets `Arc<LogEntry>` derive Serialize/Deserialize. A node's log holds
# entries behind an `Arc` so that the peers a `RaftCluster` models share one
# copy of each payload instead of one per node. Note that serde does not
# preserve sharing across a round trip -- a deserialized cluster starts with
# separate allocations again, which costs memory but not correctness.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
# These fire pervasively on the contract surface (many-field readiness/summary
# tuples returned by the route-key accessors, and builder-style report
# constructors). They are intentional and suppressed package-wide.
type_complexity = "allow"
too_many_arguments = "allow"

[lints.rustdoc]
broken_intra_doc_links = "deny"
