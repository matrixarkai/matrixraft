name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-targets --locked

      - name: Test
        run: cargo test --locked

      # `cargo build --all-targets` compiles the examples and runs none of
      # them, so `baseline_raft_operational_evidence` panicked on its own
      # bundle validation while every check stayed green. These four are the
      # examples the README tells a reader to run with no arguments, which
      # makes them the ones a stranger hits first.
      #
      # The others are left out on purpose: the scaling and throughput ones
      # want `--release` and arguments, `metrics_exporter` serves until it is
      # killed, `idle_tick_cost` is a soak, and the two benchmark examples
      # need a comparable engine on the box.
      - name: Run the documented examples
        run: |
          set -euo pipefail
          for example in debug_artifacts readiness_report read_safety \
                         baseline_raft_operational_evidence; do
            echo "== cargo run --example $example"
            cargo run --locked --example "$example" >/dev/null
          done

      - name: Doc
        run: cargo doc --no-deps --locked

  durable-peer:
    name: durable peer core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protocol build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler autoconf automake libtool
      - name: Peer quorum and recovery tests
        run: |
          cargo test --locked --features peer-runtime --test durable_peer_runtime
          cargo test --locked --features peer-runtime --test file_peer_checkpoints
          set -o pipefail
          cargo test --locked --features peer-runtime --test file_peer_checkpoints file_checkpoints_above_the_inline_limit_restore_without_full_payload_buffers -- --exact --ignored --nocapture | tee /tmp/file-checkpoint-large.log
          grep -q 'test result: ok. 1 passed' /tmp/file-checkpoint-large.log
          cargo test --locked --features peer-runtime --lib peer_runtime::
      - name: Build and document the peer API
        run: |
          cargo check --locked --all-features --all-targets
          cargo doc --locked --all-features --no-deps

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Check on MSRV
        run: cargo check --all-targets --locked

  deny:
    name: cargo-deny (licenses & advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
          arguments: --all-features

  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    # Informational: reports line/region coverage but does not gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Coverage summary
        run: cargo llvm-cov --locked --summary-only

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  prohibited-vocabulary:
    name: prohibited vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files for prohibited vocabulary
        shell: bash
        run: ./scripts/check_prohibited_vocabulary.sh

  license-headers:
    name: license headers (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify SPDX Apache-2.0 header on all Rust sources
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.rs')
          if [ -z "$files" ]; then
            echo "No Rust sources found."; exit 0
          fi
          missing=$(grep -L 'SPDX-License-Identifier: Apache-2.0' $files || true)
          if [ -n "$missing" ]; then
            echo "The following Rust sources are missing the SPDX Apache-2.0 header:"
            echo "$missing"
            exit 1
          fi
          echo "OK: all $(echo "$files" | wc -l) Rust sources carry the SPDX Apache-2.0 header."
