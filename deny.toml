# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with: cargo deny check

[advisories]
version = 2
yanked = "deny"
# The optional peer runtime pins upstream raft-rs. Its remaining advisory is
# maintenance-only; the affected protobuf decoder is absent from this graph.
# Revisit this exception when updating the pinned core. See docs/peer-runtime.md.
ignore = [{ id = "RUSTSEC-2025-0057", reason = "Pinned raft-rs uses fxhash internally; maintenance advisory, no reported vulnerability. Replace with upstream when available." }]

[licenses]
version = 2
confidence-threshold = 0.9
# Keep this list to the licenses actually present in the dependency tree. New
# permissive licenses introduced by future dependencies should be reviewed and
# added deliberately (that is the point of the gate).
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/tikv/raft-rs"]
